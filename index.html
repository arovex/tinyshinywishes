<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06010d" />
<title>Happy Birthday ✨</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06010d;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    color: rgba(255, 214, 236, 0.55);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    animation: hintPulse 3.4s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.75; }
  }
  .fallback {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #ffd6ec;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Happy birthday particle animation"></canvas>
<div class="hint">tap or click for fireworks</div>
<script src="birthday.js"></script>
</body>
</html>
